{% extends "base.html" %}
{% block title %}Contact Seller - Nova Exchange{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Contact Seller</h1>
    <div class="bg-white shadow rounded-lg p-6">
        <div class="mb-6 p-4 bg-gray-50 rounded-lg">
            <p class="text-sm text-gray-500">Regarding:</p>
            <p class="text-lg font-semibold">{{ listing_title | e }}</p>
            <p class="text-sm text-gray-500">Seller: {{ seller_email | e }}</p>
        </div>
        <form action="/api/messages" method="POST">
            <input type="hidden" name="listing_id" value="{{ listing_id }}">
            <input type="hidden" name="buyer_id" value="{{ buyer_id }}">
            <input type="hidden" name="seller_id" value="{{ seller_id }}">
            <div class="mb-4">
                <label for="content" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                <textarea name="content" id="content" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Hi, is this still available?" required></textarea>
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-emerald-700">
                Send Message
            </button>
        </form>
    </div>
</div>
{% endblock %}
