{% extends "base.html" %}
{% block title %}{{ title | e }} - Nova Exchange{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="text-center">
        <div class="text-6xl mb-4">{{ icon | e }}</div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">{{ title | e }}</h1>
        <p class="text-gray-600 mb-6">{{ message | e }}</p>
        <a href="/" class="inline-block bg-emerald-600 text-white px-6 py-3 rounded-lg hover:bg-emerald-700">
            Go Home
        </a>
    </div>
</div>
{% endblock %}
