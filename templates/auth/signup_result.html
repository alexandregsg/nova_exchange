{% extends "base.html" %}
{% block title %}Signup Result - Nova Exchange{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-8">
    {% if error_message %}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded">Signup failed: {{ error_message | e }}</div>
    {% elif success %}
    <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded">{{ message | e }}</div>
    {% endif %}
    <a href="/auth/login" class="text-emerald-600 hover:underline">Back to Login</a>
</div>
{% endblock %}
